    <!-- GitHub Pages SPA redirect: restores the deep link saved by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect.slice(location.origin.length));
        }
      })();
    </script>
